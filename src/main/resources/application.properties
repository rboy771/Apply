# =============================================
# Application: Apply – Intern Job Search Made Easy
# =============================================

spring.application.name=Apply

# ----- MariaDB DataSource -----
spring.datasource.url=jdbc:mariadb://localhost:3306/apply_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=apply_user
spring.datasource.password=apply_pass
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ----- Thymeleaf -----
spring.thymeleaf.cache=true

# ----- Server -----
server.port=8080
