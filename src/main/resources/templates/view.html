<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${jobApp.company} + ' – ' + ${jobApp.position} + ' | Apply'">View | Apply</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; letter-spacing: 0.05em; }
        .badge-APPLIED       { background-color: #0d6efd; }
        .badge-PHONE_SCREEN  { background-color: #6f42c1; }
        .badge-INTERVIEW     { background-color: #0dcaf0; color: #000; }
        .badge-TECHNICAL     { background-color: #fd7e14; }
        .badge-OFFER         { background-color: #198754; }
        .badge-ACCEPTED      { background-color: #146c43; }
        .badge-REJECTED      { background-color: #dc3545; }
        .badge-WITHDRAWN     { background-color: #6c757d; }
        dt { color: #6c757d; font-weight: 500; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; }
        dd { font-size: 1rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/applications}">
            <i class="bi bi-briefcase-fill me-1"></i>Apply
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/applications}">
                        <i class="bi bi-list-ul me-1"></i>My Applications
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/applications/new}">
                        <i class="bi bi-plus-circle me-1"></i>Add Application
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/applications}">Applications</a></li>
                    <li class="breadcrumb-item active"
                        th:text="${jobApp.company} + ' – ' + ${jobApp.position}"></li>
                </ol>
            </nav>

            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">
                        <i class="bi bi-building me-2"></i>
                        <span th:text="${jobApp.company}"></span>
                        &ndash;
                        <span th:text="${jobApp.position}"></span>
                    </h5>
                    <span th:class="'badge rounded-pill badge-' + ${jobApp.status}"
                          th:text="${jobApp.status.displayName}"></span>
                </div>

                <div class="card-body">
                    <dl class="row g-3">

                        <div class="col-md-6">
                            <dt>Company</dt>
                            <dd th:text="${jobApp.company}"></dd>
                        </div>

                        <div class="col-md-6">
                            <dt>Position</dt>
                            <dd th:text="${jobApp.position}"></dd>
                        </div>

                        <div class="col-md-6">
                            <dt>Location</dt>
                            <dd th:text="${jobApp.location != null ? jobApp.location : '—'}"></dd>
                        </div>

                        <div class="col-md-3">
                            <dt>Date Applied</dt>
                            <dd th:text="${#temporals.format(jobApp.dateApplied, 'MMMM d, yyyy')}"></dd>
                        </div>

                        <div class="col-md-3">
                            <dt>Status</dt>
                            <dd>
                                <span th:class="'badge rounded-pill badge-' + ${jobApp.status}"
                                      th:text="${jobApp.status.displayName}"></span>
                            </dd>
                        </div>

                        <div class="col-12" th:if="${jobApp.jobUrl != null and !jobApp.jobUrl.isEmpty()}">
                            <dt>Job Posting</dt>
                            <dd>
                                <a th:href="${jobApp.jobUrl}" target="_blank" rel="noopener noreferrer">
                                    <i class="bi bi-box-arrow-up-right me-1"></i>
                                    <span th:text="${jobApp.jobUrl}"></span>
                                </a>
                            </dd>
                        </div>

                        <div class="col-12" th:if="${jobApp.notes != null and !jobApp.notes.isEmpty()}">
                            <dt>Notes</dt>
                            <dd style="white-space: pre-wrap;" th:text="${jobApp.notes}"></dd>
                        </div>

                    </dl>
                </div><!-- /card-body -->

                <div class="card-footer d-flex justify-content-between">
                    <a th:href="@{/applications}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Back
                    </a>
                    <div class="d-flex gap-2">
                        <a th:href="@{/applications/{id}/edit(id=${jobApp.id})}"
                           class="btn btn-outline-primary">
                            <i class="bi bi-pencil me-1"></i>Edit
                        </a>
                        <form th:action="@{/applications/{id}/delete(id=${jobApp.id})}"
                              method="post"
                              onsubmit="return confirm('Delete this application?')">
                            <button type="submit" class="btn btn-outline-danger">
                                <i class="bi bi-trash me-1"></i>Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div><!-- /card -->

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmgAlAHsM8/2+/Mc0N4l0G5K13f8"
        crossorigin="anonymous"></script>
</body>
</html>
