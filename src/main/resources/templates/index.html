<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>My Applications | Apply</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; letter-spacing: 0.05em; }
        .badge-APPLIED       { background-color: #0d6efd; }
        .badge-PHONE_SCREEN  { background-color: #6f42c1; }
        .badge-INTERVIEW     { background-color: #0dcaf0; color: #000; }
        .badge-TECHNICAL     { background-color: #fd7e14; }
        .badge-OFFER         { background-color: #198754; }
        .badge-ACCEPTED      { background-color: #146c43; }
        .badge-REJECTED      { background-color: #dc3545; }
        .badge-WITHDRAWN     { background-color: #6c757d; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/applications}">
            <i class="bi bi-briefcase-fill me-1"></i>Apply
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/applications}">
                        <i class="bi bi-list-ul me-1"></i>My Applications
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/applications/new}">
                        <i class="bi bi-plus-circle me-1"></i>Add Application
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-1"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Header row -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0"><i class="bi bi-briefcase me-2"></i>Job Applications</h2>
        <a th:href="@{/applications/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Add Application
        </a>
    </div>

    <!-- Search / filter form -->
    <div class="card mb-4">
        <div class="card-body">
            <form method="get" th:action="@{/applications}" class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label for="company" class="form-label">Search by Company</label>
                    <input type="text" class="form-control" id="company" name="company"
                           th:value="${searchCompany}" placeholder="e.g. Google"/>
                </div>
                <div class="col-md-4">
                    <label for="status" class="form-label">Filter by Status</label>
                    <select class="form-select" id="status" name="status">
                        <option value="">All Statuses</option>
                        <option th:each="s : ${statuses}"
                                th:value="${s.name()}"
                                th:text="${s.displayName}"
                                th:selected="${s == searchStatus}"></option>
                    </select>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-outline-primary flex-fill">
                        <i class="bi bi-search me-1"></i>Search
                    </button>
                    <a th:href="@{/applications}" class="btn btn-outline-secondary flex-fill">
                        <i class="bi bi-x-lg me-1"></i>Clear
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Stats row -->
    <div class="row mb-4 g-3">
        <div class="col-6 col-md-3">
            <div class="card text-center border-primary">
                <div class="card-body py-2">
                    <div class="fs-4 fw-bold text-primary" th:text="${applications.size()}">0</div>
                    <small class="text-muted">Shown</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Applications table -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div th:if="${applications.isEmpty()}" class="text-center p-5 text-muted">
                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                <p class="mb-0">No applications found. <a th:href="@{/applications/new}">Add one!</a></p>
            </div>
            <div th:unless="${applications.isEmpty()}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Company</th>
                        <th>Position</th>
                        <th>Location</th>
                        <th>Date Applied</th>
                        <th>Status</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="app : ${applications}">
                        <td class="fw-semibold" th:text="${app.company}"></td>
                        <td th:text="${app.position}"></td>
                        <td th:text="${app.location != null ? app.location : '—'}"></td>
                        <td th:text="${#temporals.format(app.dateApplied, 'MMM d, yyyy')}"></td>
                        <td>
                            <span th:class="'badge rounded-pill badge-' + ${app.status}"
                                  th:text="${app.status.displayName}"></span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/applications/{id}(id=${app.id})}"
                               class="btn btn-sm btn-outline-secondary me-1" title="View">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{/applications/{id}/edit(id=${app.id})}"
                               class="btn btn-sm btn-outline-primary me-1" title="Edit">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/applications/{id}/delete(id=${app.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('Delete this application?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div><!-- /container -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmgAlAHsM8/2+/Mc0N4l0G5K13f8"
        crossorigin="anonymous"></script>
</body>
</html>
